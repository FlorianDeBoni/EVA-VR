# Backend API for local development, with auto-reload on source changes.
# Settings come from backend/.env.backend (API_PORT, OpenAI keys, ...).
name: eva-vr-backend

services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/backend/Dockerfile
    env_file: ../../backend/.env.backend
    ports:
      - "${API_PORT:?}:${API_PORT:?}"
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port ${API_PORT:?} --reload --reload-dir backend
    # Lets the container reach the application database published on the host (DB_HOST).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../backend:/app/backend
