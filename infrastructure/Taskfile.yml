version: "3"

# Included from the root Taskfile (flattened), so task names stay `dev:backend`, `dev:langfuse`, etc.
# `dotenv` is not supported in included Taskfiles: variables are passed with --env-file.
vars:
  LANGFUSE_COMPOSE: docker compose --env-file .env.infrastructure -f langfuse/docker-compose.yml
  DATABASE_COMPOSE: docker compose --env-file .env.infrastructure -f database/docker-compose.yml
  BACKEND_COMPOSE: docker compose --env-file ../backend/.env.backend -f backend/docker-compose.yml
  # Backend + frontend behind Caddy (/eva-vr). CADDY_NETWORK defaults to "caddy".
  DEPLOY_COMPOSE: CADDY_NETWORK=${CADDY_NETWORK:-caddy} docker compose --env-file ../backend/.env.backend -f docker-compose.deploy.yml

tasks:
  dev:backend:
    desc: Build and start the API in Docker (detached) with auto-reload; stop with docker:stop
    cmds:
      - "{{.BACKEND_COMPOSE}} up --build -d"
  dev:deploy:
    desc: Build and start the backend (eva-vr-backend:3020) and the frontend (eva-vr-frontend:80) in Docker, on the Caddy network
    cmds:
      - "{{.DEPLOY_COMPOSE}} up --build -d"
  seed:prompts:
    desc: Publish the prompts of langfuse/prompts/*.md to Langfuse as "production" (needs dev:langfuse)
    cmds:
      - >-
        {{.BACKEND_COMPOSE}} run --rm
        -v ./langfuse/prompts:/seed/prompts:ro
        backend python -m backend.scripts.seed_prompts /seed/prompts
  dev:langfuse:
    desc: Start the local Langfuse service (UI at LANGFUSE_URL, see .env.infrastructure)
    cmds:
      - "{{.LANGFUSE_COMPOSE}} up -d"
  dev:database:
    desc: Start the application Postgres database (detached, port APP_DB_PORT), wait until it is ready, apply the migrations
    cmds:
      - "{{.DATABASE_COMPOSE}} up -d --wait"
      - task: migrate:database
  migrate:database:
    desc: Apply the init scripts of database/init to the running database (safe to re-run; Docker runs them only on a new volume)
    cmds:
      - |
        for file in database/init/*.sql; do
          {{.DATABASE_COMPOSE}} exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$file" || exit 1
          echo "applied $file"
        done
  wait:langfuse:
    desc: Wait until the Langfuse web service answers (up to 3 minutes)
    cmds:
      - |
        url=$(grep -E '^LANGFUSE_URL=' .env.infrastructure | cut -d= -f2-)
        url=${url:-http://localhost:3000}
        for _ in $(seq 1 90); do
          curl -fsS "$url/api/public/health" >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "Langfuse did not become ready at $url" >&2
        exit 1
  stop:frontend:
    desc: Stop the frontend dev server of this project, if one is running (frees FRONTEND_PORT)
    cmds:
      # The frontend runs locally (npm), not in Docker. Matches only this project's own vite
      # (its command line holds the full path), so no unrelated process can be killed.
      # pkill exits 1 when nothing matched: that is fine.
      - pkill -f "{{.ROOT_DIR}}/frontend/node_modules/.bin/vite" || true
  docker:stop:
    desc: Stop all the services (frontend, backend, Langfuse, database) without removing them
    cmds:
      - task: stop:frontend
      - "{{.DEPLOY_COMPOSE}} stop"
      - "{{.BACKEND_COMPOSE}} stop"
      - "{{.LANGFUSE_COMPOSE}} stop"
      - "{{.DATABASE_COMPOSE}} stop"
  docker:delete:
    desc: Stop everything and delete the Docker services with their volumes (data is lost); frees all the ports
    cmds:
      - task: stop:frontend
      - "{{.DEPLOY_COMPOSE}} down --volumes"
      - "{{.BACKEND_COMPOSE}} down --volumes"
      - "{{.LANGFUSE_COMPOSE}} down --volumes"
      - "{{.DATABASE_COMPOSE}} down --volumes"
