[project]
name = "eva-vr"
version = "0.1.0"
description = "Step 1 chatbot for eva-vr"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.18",
]

[project.scripts]
eva-vr = "eva_vr:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
